# esphome-music-bar — artwork configuration
#
# Read by the artwork normalizer, and by the Home Assistant side that serves
# pages to the panel. Editing it never requires reflashing.
#
# Optional. Without any of this the panel draws its own monograms and the
# browser still works — artwork is an upgrade, not a prerequisite.
#
# The Music Assistant token is not here: set $MA_TOKEN, pass --token, or put it
# in secrets.yaml. See docs/spec.md for why items are addressed by name rather
# than by URI, and why artwork goes through a normalizer at all.

music_assistant:
  # Music Assistant's own API, not Home Assistant's.
  url: http://192.168.1.10:8095
  # The Music Assistant queue entity to play through — its own player entity,
  # not the underlying speaker's.
  player: media_player.living_room

home_assistant:
  url: http://192.168.1.10:8123

artwork:
  # Where the normalizer writes, and where the panel reads. The default is
  # Home Assistant's own www folder, which needs no extra infrastructure:
  #   <ha-config>/www/music-bar/  ->  http://<ha>:8123/local/music-bar/
  base_url: http://192.168.1.10:8123/local/music-bar
  output_dir: /config/www/music-bar

  # Every image is emitted at exactly this size, square, padded rather than
  # cropped. Do not vary it per section: identical dimensions across all
  # tiles are what stop the device from reallocating its image buffers.
  tile_px: 84

  # Padding and mat colour. Matching them makes the padding invisible.
  mat_color: "#1E1E1E"

  # Most station logos are opaque with their own background, often white, so a
  # grid of them against a dark UI reads as mismatched rectangles. A shared
  # rounded edge makes them look like one set of cards. Set 0 for hard corners.
  corner_radius: 10

  # Shrinks artwork inside the tile. Only useful if your logos are transparent:
  # on an opaque logo it insets the logo's own background too, which puts a
  # sharp-cornered square inside the rounded card and undoes the rounding.
  inset: 0

  # Size requested from Music Assistant's proxy before normalizing. It allows
  # 80/160/256/512 only and never upscales, so keep this above tile_px.
  proxy_size: 256

  # Your own images, used ahead of anything Music Assistant has. Named by
  # slug: "Radio Meuh" -> radio_meuh.png. See overrides/README.md.
  overrides_dir: ./overrides

# Which media types the panel offers, in this order. Favorites only — that is
# the whole content model (docs/spec.md section 5). Mark something favorite in
# any Music Assistant client and it appears; there is no list of names to keep
# in sync here.
#
# Drop a type you never favorite, or reorder them to change what comes first.
sections:
  - name: Radio
    media_type: radio
    source: favorites

  - name: Playlists
    media_type: playlist
    source: favorites

  - name: Albums
    media_type: album
    source: favorites

# The normalizer also still accepts `source: all` (optionally with `limit:`) and
# `source: list` with explicit names. Those predate the favorites-only decision
# and the panel does not use them; they are useful for generating artwork for
# something before you favorite it. They will go when the Home Assistant
# integration lands.
