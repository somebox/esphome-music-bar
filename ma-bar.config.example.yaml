# ma-bar-3.49 — user configuration
#
# Read by the Home Assistant package (which serves pages to the panel) and by
# the artwork normalizer. Editing it does not require reflashing the panel.
#
# See docs/spec.md for why items are addressed by name rather than by URI,
# and why artwork goes through a normalizer instead of straight to the device.

music_assistant:
  # Music Assistant's own API, not Home Assistant's.
  url: http://192.168.1.10:8095
  # The Music Assistant queue entity to play through — its own player entity,
  # not the underlying speaker's.
  player: media_player.living_room

home_assistant:
  url: http://192.168.1.10:8123

artwork:
  # Where the normalizer writes, and where the panel reads. The default is
  # Home Assistant's own www folder, which needs no extra infrastructure:
  #   <ha-config>/www/ma-bar/  ->  http://<ha>:8123/local/ma-bar/
  base_url: http://192.168.1.10:8123/local/ma-bar
  output_dir: /config/www/ma-bar

  # Every image is emitted at exactly this size, square, padded rather than
  # cropped. Do not vary it per section: identical dimensions across all
  # tiles are what stop the device from reallocating its image buffers.
  tile_px: 84

  # Padding and mat colour. Matching them makes the padding invisible.
  mat_color: "#1E1E1E"

  # Size requested from Music Assistant's proxy before normalizing. It allows
  # 80/160/256/512 only and never upscales, so keep this above tile_px.
  proxy_size: 256

  # Your own images, used ahead of anything Music Assistant has. Named by
  # slug: "Radio Meuh" -> radio_meuh.png. See overrides/README.md.
  overrides_dir: ./overrides

# Each section contributes its items to the browser, in this order.
# source: favorites | all | list
sections:
  - name: Radio
    media_type: radio
    source: all          # only 1 of 15 radios is favorited on the reference
                         # install — check yours before using `favorites`
    limit: 20

  - name: Playlists
    media_type: playlist
    source: favorites

  - name: Albums
    media_type: album
    source: list
    items:
      - Kind of Blue
      # A name that is ambiguous within its media type can pin an explicit URI.
      - name: Greatest Hits
        uri: library://album/412
