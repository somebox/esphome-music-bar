# No-hardware gates for esphome-music-bar.
#
# - tests: the normalizer's pure functions, plus the check that the device's
#   monogram header and the Python script still agree on colours
# - esphome-smoke: validate every ESPHome config and compile the factory image
#
# On-device and Home Assistant checks stay manual — see docs/plan.md.

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The device-agreement test compiles esphome/includes/music_bar_monogram.h
      # and diffs it against the Python. ubuntu-latest already has g++.
      - name: Run tests
        run: make test

  esphome-smoke:
    name: ESPHome smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: esphome/requirements.txt

      - name: Install ESPHome
        run: pip install -r esphome/requirements.txt

      - name: Cache ESPHome / PlatformIO build
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esphome/.esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('esphome/requirements.txt', 'esphome/**/*.yaml', 'esphome/includes/**') }}
          restore-keys: |
            esphome-${{ runner.os }}-

      - name: Validate configs and compile the factory image
        run: make -C esphome smoke-test ESPHOME=esphome
