#
# Until it lands the panel shows random noise, because nothing ever initialises
# the LCD and it powers up holding whatever was in its memory. It looks broken
# and is not: check the Setup Status entity rather than the screen.
#
# Blanking it in the meantime needs the backlight pin, which is one of the
# things the hifi-panel config has and this does not.
