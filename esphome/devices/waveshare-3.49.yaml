# Device profile — Waveshare ESP32-S3-Touch-LCD-3.49.
#
# Everything that is true of this panel and not of the next one: the SoC and
# memory, the pin map, the screen geometry, and the tile size that follows from
# it. The generic half lives in music-bar.base.yaml, which this includes.
#
# The chain is: <build config> -> devices/<profile>.yaml -> music-bar.base.yaml
#
# Substitutions here override the base's defaults, because a package's
# substitutions lose to those of the config including it. That is the whole
# mechanism — no conditionals, no per-device branching in the base.
#
# ── Adding another device ──────────────────────────────────────────────────
#
# Copy this file, change the pins, geometry and tile size, and add a build
# config that includes it. Nothing in the base, the blueprints or the artwork
# normalizer should need a change; if it does, that is a sign something
# device-specific leaked out of this file. Issues requesting a device, and pull
# requests adding one, are both welcome.
#
# Today this is the only profile, and the project is deliberately opinionated
# about it: fixed sizes, one layout, no runtime geometry negotiation.
#
# ── What is on this board, and what this profile uses ──────────────────────
#
# Pins below are from Waveshare's own factory program (Examples/ESP-IDF/
# 11_FactoryProgram/main/user_config.h in waveshareteam/ESP32-S3-Touch-LCD-3.49)
# and every one this profile uses is confirmed running on hardware.
#
#   USED
#     ESP32-S3R8, 8MB octal PSRAM, 16MB flash   measured: PSRAM 8192 KB @ 80MHz
#     AXS15231B display, 172x640, QSPI          CS 9, CLK 10, D0-D3 11-14, RST 21
#     AXS15231B touch, I2C 0x3b                 SDA 17, SCL 18
#     Backlight, PWM                            GPIO 8   (a Home Assistant light)
#     QMI8658 IMU, I2C 0x6b                     SDA 47, SCL 48   (accelerometer)
#
#   PRESENT AND DELIBERATELY UNUSED
#     PCF85063 RTC, I2C 0x51        Home Assistant supplies the time, and nothing
#                                   on the panel needs a clock that survives a
#                                   power cut. ESPHome has a pcf85063 time
#                                   platform if that changes.
#     TCA9554PWR expander, I2C 0x20 Nothing this project drives sits behind it —
#                                   display reset and backlight are direct GPIO,
#                                   which is why the panel works without it. It
#                                   appears in Waveshare's battery/power example.
#     Battery header + VBAT sense   GPIO 16. The panel is mains-powered by design
#                                   (docs/spec.md section 1).
#     TF card slot, SDMMC 1-bit     CMD 39, CLK 41, D0 40. No use case: the panel
#                                   stores no content, which is the whole point.
#     ES8311 DAC, ES7210 ADC,       The panel is a controller; Music Assistant
#     dual microphone array,        drives real speakers. See docs/spec.md for
#     MX1.25 speaker header         why this is the most interesting thing the
#                                   board can do that this project does not.
#     PWR / BOOT / RESET buttons    Not wired up. A physical play/pause is a
#                                   reasonable future addition; BOOT is the usual
#                                   GPIO 0 strap, unverified on this board.
#     22-pin expansion header       For whatever you like.
#
#   The IMU's gyroscope is read by the component but unused: orientation needs
#   only the accelerometer.

substitutions:
  device_profile: "waveshare-3.49"

  # Screen. 172x640 native portrait, driven rotated 90 degrees as a 640x172
  # landscape bar. The AXS15231B drives display and touch from one chip over
  # QSPI, so the pin map and init sequence are inseparable from this board.
  display_width: "640"
  display_height: "172"

  # Artwork tile size, in pixels.
  #
  # A property of *this* panel, not of the project. It follows from the layout:
  # five tiles across 640px with room for a two-line name beneath each. The
  # five browser image slots allocate a buffer of exactly this size once and
  # reuse it forever, which is only safe while every image reaching them is
  # exactly this big — see docs/spec.md section 4.
  #
  # The panel reports it to Home Assistant (the Tile Size sensor in the base)
  # so the artwork side can refuse to push images rendered at another size.
  # Change it here, reflash, and rerun the normalizer with --force.
  tile_px: "84"

  # Pin map, from Waveshare's own example
  # (Examples/Arduino/09_LVGL_V8_Test/user_config.h in
  # waveshareteam/ESP32-S3-Touch-LCD-3.49), and confirmed by the hifi-panel
  # build running on this hardware.
  #
  # Display and touch are one chip (AXS15231B) but reached two ways: the panel
  # over QSPI, the touch controller over I2C.
  qspi_clk_pin:  GPIO10
  qspi_d0_pin:   GPIO11
  qspi_d1_pin:   GPIO12
  qspi_d2_pin:   GPIO13
  qspi_d3_pin:   GPIO14
  lcd_cs_pin:    GPIO9
  lcd_reset_pin: GPIO21
  backlight_pin: GPIO8

  touch_sda_pin: GPIO17
  touch_scl_pin: GPIO18

  # The QMI8658 IMU sits on its own I2C bus, which is why an I2C scan of the
  # touch bus never finds it. A PCF85063 RTC shares it at 0x51, unused here.
  imu_sda_pin: GPIO47
  imu_scl_pin: GPIO48

packages:
  music_bar: !include ../music-bar.base.yaml

# -- Display, touch and backlight -------------------------------------------
# Ported from the hifi-panel build that ran on this same hardware, with its
# findings kept as comments — they were expensive to learn.

# QSPI, for the panel.
spi:
  id: quad_spi
  type: quad
  clk_pin: ${qspi_clk_pin}
  # Block form, not [a, b, c]: a ${substitution} inside a YAML flow sequence
  # trips the parser on its opening brace.
  data_pins:
    - ${qspi_d0_pin}
    - ${qspi_d1_pin}
    - ${qspi_d2_pin}
    - ${qspi_d3_pin}

i2c:
  # Touch controller.
  - id: bus_touch
    sda: ${touch_sda_pin}
    scl: ${touch_scl_pin}
    frequency: 400kHz
    scan: false
  # IMU and RTC. 100kHz rather than 400kHz: nothing here is rate-sensitive and
  # the slower clock is more forgiving of the board's trace lengths.
  - id: bus_aux
    sda: ${imu_sda_pin}
    scl: ${imu_scl_pin}
    frequency: 100kHz
    scan: false

# Native 172x640 portrait. Deliberately no `rotation:` here — LVGL rotates
# globally, which is the only arrangement where touch hit-testing follows.
display:
  - platform: qspi_dbi
    id: lcd
    model: AXS15231
    spi_id: quad_spi
    cs_pin: ${lcd_cs_pin}
    reset_pin: ${lcd_reset_pin}
    data_rate: 40MHz
    spi_mode: MODE0
    dimensions:
      width: ${display_height}
      height: ${display_width}
    color_order: rgb
    invert_colors: false
    # The AXS15231 only does partial draws on 8-pixel boundaries and 172 is not
    # divisible by 8, which leaves stale pixels behind on a partial redraw.
    draw_rounding: 16
    update_interval: never
    auto_clear_enabled: false

# No `transform` for rotation — LVGL's global rotation handles hit-testing for
# widgets. swap_xy/mirror_y below are a *hardware* fact and independent of it:
# this chip's "x" channel is physically the long 640 axis. Without the swap,
# touch x is normalised against the wrong maximum and clamps near it, which
# looks like every press landing at the right-hand edge.
touchscreen:
  - platform: axs15231
    id: touch
    i2c_id: bus_touch
    display: lcd
    transform:
      swap_xy: true
      mirror_y: true

output:
  - platform: ledc
    pin: ${backlight_pin}
    id: backlight_pwm
    frequency: 5000Hz
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 200ms

# -- Auto-rotation ----------------------------------------------------------
# Flips the UI when the panel is mounted the other way up. Ported from
# hifi-panel, where it was observed working.
#
# lvgl.display.set_rotation is a real runtime action — it re-sets the
# resolution, updates orientation and invalidates the screen — and LVGL reads
# the rotation live when translating touch coordinates, so hit-testing follows
# the flip with no extra work. It only works because rotation was enabled at
# setup via `lvgl: rotation:`; without that it logs a warning and does nothing.
motion:
  - platform: qmi8658
    id: imu
    i2c_id: bus_aux
    address: 0x6b
    # Orientation changes at human speed, but the response has to feel
    # immediate. At a 5s poll with a 2-sample debounce you had to hold the
    # panel upside down for 10-15 seconds before anything happened, which reads
    # as broken.
    update_interval: 1s

sensor:
  # Published slowly, read quickly.
  #
  # on_value fires *after* filters, so driving the orientation check from it
  # would hand the script a value up to a minute old and the panel would take
  # that long to react. on_raw_value fires before them: the script sees every
  # sample, while Home Assistant sees one a minute — and only if someone enables
  # the entity, which is worth having when the flip threshold needs looking at.
  - platform: motion
    motion_id: imu
    type: acceleration_y
    id: accel_y
    name: "Tilt Y"
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 2
    filters:
      - throttle: 60s
    on_raw_value:
      - lambda: "id(accel_y_raw) = x;"
      - script.execute: check_orientation
  # Not used by the logic, and kept deliberately: gravity sitting on Y is an
  # inference from where this panel reads upright, not a proven flip axis. If a
  # rotation about a different body axis ever needs handling, Z is the first
  # thing to try and it is already wired up.
  - platform: motion
    motion_id: imu
    type: acceleration_z
    id: accel_z
    name: "Tilt Z"
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 2
    filters:
      - throttle: 60s

globals:
  # The latest raw reading, because the published sensor is throttled and its
  # .state would lag by up to a minute.
  - id: accel_y_raw
    type: float
    restore_value: false
    initial_value: "NAN"
  # Persisted, so a reboot comes back the way the panel is actually sitting
  # rather than flashing to the default and correcting itself seconds later.
  - id: rot_flipped
    type: bool
    restore_value: true
    initial_value: "false"
  # Consecutive readings agreeing with a change. A flip only applies once this
  # reaches 3, so a knock or a lift-and-reposition does not rotate the UI
  # mid-gesture.
  - id: rot_agree
    type: int
    restore_value: false
    initial_value: "0"
  # 0 = nothing to do, 1 = apply upright, 2 = apply flipped. Only a lambda can
  # do the decision, and only an action can set the rotation, so the decision
  # is handed across in this.
  - id: rot_apply
    type: int
    restore_value: false
    initial_value: "0"

script:
  - id: check_orientation
    mode: single
    then:
      - lambda: |-
          id(rot_apply) = 0;
          float y = id(accel_y_raw);
          if (std::isnan(y)) return;
          bool want;
          // A wide dead band: laid flat or carried, Y sits near zero and
          // nothing happens, so only a decisive orientation counts.
          if (y > 0.4f)       want = true;    // upside down
          else if (y < -0.4f) want = false;   // upright
          else                { id(rot_agree) = 0; return; }
          if (want == id(rot_flipped)) { id(rot_agree) = 0; return; }
          if (++id(rot_agree) < 3) {
            ESP_LOGD("music_bar", "orientation: %s candidate %d/3 (accel_y=%.2f)",
                     want ? "flipped" : "upright", id(rot_agree), y);
            return;
          }
          id(rot_agree) = 0;
          id(rot_flipped) = want;
          id(rot_apply) = want ? 2 : 1;
          ESP_LOGI("music_bar", "orientation: %s (accel_y=%.2f)",
                   want ? "flipped" : "upright", y);
      - if:
          condition:
            lambda: "return id(rot_apply) == 2;"
          then:
            - lvgl.display.set_rotation: 270°
      - if:
          condition:
            lambda: "return id(rot_apply) == 1;"
          then:
            - lvgl.display.set_rotation: 90°

esphome:
  on_boot:
    # Re-apply the persisted orientation. Priority is below the base's own
    # on_boot so LVGL is up by the time this runs.
    priority: -200
    then:
      - if:
          condition:
            lambda: "return id(rot_flipped);"
          then:
            - lvgl.display.set_rotation: 270°
