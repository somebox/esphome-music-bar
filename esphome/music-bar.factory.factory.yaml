# esphome-music-bar — factory flash image (bench flash / web flasher).
#
# The entry point for a cable flash or ESP Web Tools. Identical to
# music-bar.factory.yaml for now; HTTP self-update stays disabled until a release
# publishes a real manifest.json and firmware.ota.bin, since pointing at an
# unpublished URL only produces boot-time 404 noise. ESPHome OTA from Home
# Assistant works either way via the base's `ota:` block.
#
# Users and the Device Builder should import music-bar.factory.yaml, not this file.

packages:
  factory: !include music-bar.factory.yaml

