# esphome-music-bar — shared base configuration.
#
# Everything the panel is, minus the parts that differ per device. Included as
# a package from a small per-device YAML:
#
#   substitutions:
#     name: music-bar-kitchen
#     friendly_name: Kitchen Panel
#   packages:
#     music_bar: !include music-bar.base.yaml
#
# Or remotely:
#
#   packages:
#     music_bar: github://somebox/esphome-music-bar/esphome/music-bar.base.yaml@main
#
# No secrets, and nothing to edit after adoption. A freshly flashed panel:
#   - comes up as a Wi-Fi AP with a captive portal
#   - accepts Wi-Fi credentials over USB-CDC (improv-serial) and BLE (esp32_improv)
#   - is discovered by Home Assistant over the native API once on Wi-Fi
#   - is handed a per-device Noise encryption key by Home Assistant at adoption
#
# Everything the panel *displays* arrives at runtime from Home Assistant, so
# your Music Assistant player, your favorites and your artwork are never baked
# into the firmware. See docs/spec.md section 7.

substitutions:
  name: music-bar
  friendly_name: Music Panel
  room: ""
  device_description: "Music Assistant panel on a Waveshare ESP32-S3-Touch-LCD-3.49"
  # ESPHome splits this on the dot into namespace and name, so the name itself
  # cannot contain one — hence "Music Bar" rather than "esphome-music-bar".
  project_name: "somebox.Music Bar"
  project_version: "0.1.0-dev"

  # Logging level: NONE, ERROR, WARN, INFO (default), DEBUG, VERBOSE, VERY_VERBOSE
  log_level: "INFO"
  # DNS suffix appended to the hostname, so the panel appears as
  # music-bar-XXXXXX.local (or .iot.home.lan, etc.)
  dns_domain: ".local"

  # How long to wait for Home Assistant to answer the boot handshake before
  # deciding it is not going to.
  handshake_timeout: "2s"

  # ── Device-specific, and set by the device profile ──────────────────────
  #
  # These belong to a panel, not to the project. devices/<profile>.yaml sets
  # them and includes this file, so its values win. The defaults below exist
  # only so this file validates on its own — change them in the profile, not
  # here. See devices/waveshare-3.49.yaml.
  device_profile: "none"
  display_width: "640"
  display_height: "172"
  tile_px: "84"
  imu_sda_pin: GPIO47
  imu_scl_pin: GPIO48

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  # Append the last 3 bytes of the MAC to the hostname so several unflashed
  # panels do not collide on the network on first boot.
  name_add_mac_suffix: true
  # Pinned to what this is developed and tested against. The project tracks
  # current ESPHome rather than carrying compatibility shims for older
  # releases; 2026.5 was already the floor, because earlier versions place
  # touches in the wrong place on a rotated display.
  min_version: 2026.7.3
  project:
    name: "${project_name}"
    version: "${project_version}"
  includes:
    - includes/music_bar_monogram.h
    - includes/music_bar_util.h
  on_boot:
    priority: -100
    then:
      # Constants, published once. See the note on these sensors below.
      - text_sensor.template.publish:
          id: tile_size
          state: "${tile_px}"
      - text_sensor.template.publish:
          id: device_profile_sensor
          state: "${device_profile}"
      - script.execute: announce_setup_state

# Waveshare ESP32-S3-Touch-LCD-3.49: 16MB flash, octal PSRAM. ESPHome needs a
# board from its built-in list; the generic S3 devkit matches the SoC and the
# pinout is board-specific via substitutions rather than devkit silkscreen.
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# The framebuffer needs this. Octal at 80MHz is what the board carries.
psram:
  mode: octal
  speed: 80MHz

logger:
  id: logger_main
  level: ${log_level}

# Native Home Assistant API.
#
# No encryption key is baked into the firmware. The panel compiles with noise
# support but no PSK; on first connect Home Assistant generates a per-device
# key, sends it via the noise_encryption_set_key RPC, and the panel persists it
# in flash. Plaintext is refused afterwards. Requires ESPHome >= 2025.10.0 and
# Home Assistant with aioesphomeapi >= 2025.10.0.
#
# To pin a static key instead (offline or CI builds), set
# `api: encryption: key: !secret music_bar_api_key` in a per-device YAML — see
# secrets-example.yaml.
api:
  id: api_server
  encryption:

  # The handshake starts here, not on Wi-Fi connect.
  #
  # Wi-Fi comes up several seconds before Home Assistant's API client attaches,
  # and an event fired in that window is discarded outright — the panel logs
  # "Home Assistant event 'esphome.music_bar_hello' dropped; no client
  # connected" and then waits forever for an answer to a question nobody heard.
  # Observed on hardware; it made the panel look permanently unconfigured
  # against a Home Assistant that was working fine.
  #
  # Firing on client connect also means a Home Assistant restart re-runs the
  # handshake by itself, so the panel recovers without anyone pressing Retry.
  on_client_connected:
    - script.execute: ha_handshake

  on_client_disconnected:
    - script.execute: announce_setup_state

  # The contract with Home Assistant. Everything the panel shows arrives
  # through these three actions; the panel holds no content of its own.
  #
  # Array arguments arrive as FixedVector<T> const& — a non-owning view into
  # the receive buffer, which is reused as soon as the synchronous part of the
  # handler returns. Every handler below copies immediately and stays
  # synchronous. Adding a delay / wait_until / script.wait to one of these
  # switches it to owning std::vector types and changes the contract; don't.
  actions:
    # Home Assistant answering the boot handshake. Until this arrives the panel
    # assumes it is not set up yet.
    - action: hello_ack
      then:
        - lambda: |-
            id(ha_handshake_ok) = true;
        - script.execute: announce_setup_state
        # Ask for the first page as soon as anyone is listening.
        - script.execute:
            id: request_page
            page: 0

    # Where the panel currently sits in the favorites list, and how long that
    # list is. Home Assistant sets this whenever it starts a favorite; the
    # panel uses it as the cursor prev/next move.
    #
    # An index of -1 means "playing something that is not one of your
    # favorites", which is the normal state after starting music from a phone.
    # Next from there goes to the first favorite rather than guessing.
    #
    # How long the list is arrives with each page instead, since that is when
    # Home Assistant has counted it anyway.
    - action: set_favorite_index
      variables:
        index: int
      then:
        - lambda: |-
            id(favorite_index) = index;
            // Home Assistant calls this at the end of a play, so it doubles as
            // an acknowledgement: seeing it means the branch ran to completion,
            // and not seeing it after a tap means it did not.
            ESP_LOGI("music_bar", "<- Home Assistant set favorite index %d", index);

    # Now Playing. Pushed as flat fields rather than a media player entity
    # because the useful values are scattered across Music Assistant's entity
    # model, and that template logic belongs in Home Assistant.
    - action: now_playing
      variables:
        title: string
        artist: string
        album: string
        state: string
        art_url: string
      then:
        - lambda: |-
            id(np_title) = music_bar::clean(title);
            id(np_artist) = music_bar::clean(artist);
            id(np_album) = music_bar::clean(album);
            id(np_state) = music_bar::clean(state);
            // Music Assistant answers on two ports and Home Assistant
            // alternates entity_picture between them, so identical artwork
            // arrives as two different URLs seconds apart. Compare path and
            // query only, and against what is actually on screen — ESPHome's
            // online_image silently drops an update while a download is in
            // flight, so a requested-URL variable can advance without anything
            // having changed. (docs/spec.md section 6)
            {
              const std::string art = music_bar::clean(art_url);
              id(np_art_url) = music_bar::strip_origin(art);
              id(np_art_url_full) = art;
            }
            // Only when the track actually changes: Home Assistant pushes on
            // every attribute change, which on some providers includes a
            // position update every second.
            static std::string last_logged;
            std::string sig = id(np_album) + "|" + id(np_artist) + "|" + id(np_title);
            if (sig != last_logged) {
              last_logged = sig;
              ESP_LOGI("music_bar", "now playing: %s / %s / %s [%s]%s",
                       id(np_album).c_str(), id(np_artist).c_str(),
                       id(np_title).c_str(), id(np_state).c_str(),
                       id(np_art_url).empty() ? " (no art)" : "");
            }
        - script.execute: paint_now_playing

    # One browser page: five items, in order. Artwork URLs may be empty, in
    # which case the panel draws its own monogram for that tile and no image
    # slot is touched at all.
    - action: page
      variables:
        page: int
        total_pages: int
        total_items: int
        names: string[]
        uris: string[]
        art_urls: string[]
      then:
        - lambda: |-
            id(page_index) = page;
            id(page_total) = total_pages;
            id(favorite_total) = total_items;
            id(tile_names).assign(names.begin(), names.end());
            id(tile_uris).assign(uris.begin(), uris.end());
            id(tile_art_urls).assign(art_urls.begin(), art_urls.end());
            // INFO, not DEBUG: a page turn happens at human rate, and this
            // one line answers "is Home Assistant actually answering?" — the
            // question every install failure so far has come down to.
            ESP_LOGI("music_bar", "page %d/%d, %u of %d favorites, %u with artwork",
                     page + 1, total_pages, (unsigned) id(tile_names).size(),
                     total_items,
                     (unsigned) music_bar::count_non_empty(id(tile_art_urls)));
        - script.execute: paint_tiles

ota:
  - platform: esphome
    id: ota_esphome

# Wi-Fi: no SSID or password here on purpose.
#   - First boot: the AP comes up and the captive portal serves a setup page.
#   - improv-serial sets credentials over USB-CDC (the web-flasher path).
#   - esp32_improv sets them over BLE (the Home Assistant path).
# Once provisioned, credentials live in flash and the AP stays off.
wifi:
  id: wifi_component
  ap: {}
  domain: "${dns_domain}"
  # Only updates what the panel is saying. The handshake waits for an API
  # client to exist — see the note on api: on_client_connected above.
  on_connect:
    - script.execute: announce_setup_state
  on_disconnect:
    - script.execute: announce_setup_state

captive_portal:
  id: captive_portal_main

improv_serial:
  id: improv_serial_main

esp32_improv:
  id: esp32_improv_main
  authorizer: none

mdns:
  id: mdns_main
  disabled: false

# -- Setup state ------------------------------------------------------------
# The panel has a screen, so it can say what is wrong with its own install
# instead of looking broken.
#
# The trap this exists for: Home Assistant's per-device "Allow the device to
# perform Home Assistant actions" toggle defaults OFF on recent releases, and
# silently no-ops every call with nothing logged anywhere. Buttons visibly
# react and nothing happens. The panel cannot read that setting, but it can
# notice that nobody answered.

globals:
  - id: ha_handshake_ok
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ha_handshake_attempted
    type: bool
    restore_value: false
    initial_value: "false"
  # page_setup is declared first, so it is what LVGL shows at boot.
  - id: on_setup_page
    type: bool
    restore_value: false
    initial_value: "true"

  # Now Playing, as pushed by Home Assistant.
  - id: np_title
    type: std::string
    restore_value: false
  - id: np_artist
    type: std::string
    restore_value: false
  - id: np_album
    type: std::string
    restore_value: false
  - id: np_state
    type: std::string
    restore_value: false
  # Two forms of the same thing: what to fetch, and what to compare.
  # Music Assistant answers on two ports and Home Assistant alternates
  # entity_picture between them, so the same artwork arrives as two different
  # URLs seconds apart. Comparing whole URLs treats those as a change and
  # refetches artwork already on screen.
  - id: np_art_url
    type: std::string
    restore_value: false
  - id: np_art_url_full
    type: std::string
    restore_value: false
  - id: shown_art_url
    type: std::string
    restore_value: false

  # Where the panel sits in the favorites list. The list itself lives in Home
  # Assistant — this is only the cursor, so prev/next are arithmetic here and a
  # lookup there. -1 means what is playing is not a favorite.
  - id: favorite_index
    type: int
    restore_value: false
    initial_value: "-1"
  - id: favorite_total
    type: int
    restore_value: false
    initial_value: "0"

  # Scratch for the outgoing event payloads. Script parameters are not in scope
  # inside the event's own lambdas, so the values are staged here first.
  - id: page_requested
    type: int
    restore_value: false
    initial_value: "0"
  - id: pending_index
    type: int
    restore_value: false
    initial_value: "0"
  - id: pending_uri
    type: std::string
    restore_value: false
  - id: pending_name
    type: std::string
    restore_value: false

  # The current browser page.
  - id: page_index
    type: int
    restore_value: false
    initial_value: "0"
  - id: page_total
    type: int
    restore_value: false
    initial_value: "0"
  - id: tile_names
    type: std::vector<std::string>
    restore_value: false
  - id: tile_uris
    type: std::vector<std::string>
    restore_value: false
  - id: tile_art_urls
    type: std::vector<std::string>
    restore_value: false

# Everything the panel asks of Home Assistant goes out as an event rather than
# as a call to a named script.
#
# Events are what blueprints can trigger on. A script call would tie the
# firmware to one entity id — `script.music_bar_page` — which a user creating a
# script from a blueprint cannot be made to produce, since the entity id comes
# from whatever they name it. An event has no such constraint, so the whole
# Home Assistant side can ship as blueprints with nothing to rename.
#
# Every event carries `device`, taken from App.get_name() rather than the
# `name` substitution, because name_add_mac_suffix means the running device is
# `music-bar-a1b2c3` and not `music-bar`. Home Assistant turns that back into
# the action prefix by replacing dashes with underscores.
script:
  # Ask Home Assistant to prove it can call back. The blueprint answers by
  # calling the hello_ack action above. Nothing else is attempted until it does.
  # Retries rather than asking once.
  #
  # There are two windows early in a connection where an event is discarded
  # outright, and both were hit on hardware. Wi-Fi comes up before the API
  # client attaches ("no client connected"), and the client attaches before it
  # subscribes to actions ("client has not subscribed to actions (yet)").
  # Neither is an error, and neither is something the panel can observe — so it
  # asks again until it gets an answer rather than trying to detect readiness.
  #
  # Stops as soon as hello_ack arrives, so the usual case is one event.
  - id: ha_handshake
    mode: restart
    then:
      - lambda: |-
          id(ha_handshake_attempted) = true;
      - repeat:
          count: 6
          then:
            - if:
                condition:
                  lambda: "return !id(ha_handshake_ok);"
                then:
                  - homeassistant.event:
                      event: esphome.music_bar_hello
                      data:
                        device: !lambda "return App.get_name();"
                  - delay: ${handshake_timeout}
      # Whatever happened, say so on screen and in the diagnostic sensor.
      - script.execute: announce_setup_state

  # Ask for a page of favorites. Wraps at both ends, so paging past the last
  # page returns to the first rather than stopping dead.
  - id: request_page
    mode: restart
    parameters:
      page: int
    then:
      - lambda: |-
          int target = page;
          if (id(page_total) > 0) {
            if (target < 0) target = id(page_total) - 1;
            if (target >= id(page_total)) target = 0;
          } else if (target < 0) {
            target = 0;
          }
          id(page_requested) = target;
          // Log what the panel asks for, not only what it is told. Without
          // this, "Home Assistant never answered" and "the panel never asked"
          // look identical from the log.
          ESP_LOGI("music_bar", "-> asking for page %d", id(page_requested));
      - homeassistant.event:
          event: esphome.music_bar_page
          data:
            device: !lambda "return App.get_name();"
            page: !lambda "return id(page_requested);"

  # Play a tile from the current page. The panel sends the URI it was given
  # rather than a name, because it already has the resolved value and a second
  # name lookup could land somewhere else.
  - id: play_tile
    mode: restart
    parameters:
      index: int
    then:
      - lambda: |-
          id(pending_uri) = "";
          id(pending_name) = "";
          id(pending_index) = index;
          if (index >= 0 && index < (int) id(tile_uris).size()) {
            id(pending_uri) = id(tile_uris)[index];
            if (index < (int) id(tile_names).size())
              id(pending_name) = id(tile_names)[index];
          }
      - if:
          condition:
            lambda: "return !id(pending_uri).empty();"
          then:
            - lambda: |-
                ESP_LOGI("music_bar", "-> asking to play tile %d: %s (%s)",
                         id(pending_index), id(pending_name).c_str(),
                         id(pending_uri).c_str());
            - homeassistant.event:
                event: esphome.music_bar_play
                data:
                  device: !lambda "return App.get_name();"
                  uri: !lambda "return id(pending_uri);"
                  name: !lambda "return id(pending_name);"
                  # Where this tile sits in the whole favorites list, so prev
                  # and next continue from the pick rather than from wherever
                  # the cursor had got to.
                  index: !lambda "return id(page_index) * 5 + id(pending_index);"
            # Back to Now Playing so the choice is visible. Playing something
            # and being left staring at the grid reads as if the tap missed.
            - lvgl.page.show: page_now_playing
          else:
            - lambda: 'ESP_LOGW("music_bar", "tile %d has no URI", index);'

  # Prev / next: move the cursor along the favorites list and ask Home
  # Assistant to play whatever lands there. Arithmetic here, lookup there.
  - id: favorite_step
    mode: restart
    parameters:
      delta: int
    then:
      - lambda: |-
          const int total = id(favorite_total);
          if (total <= 0) {
            // Home Assistant has not told us how long the list is yet.
            id(pending_index) = 0;
          } else if (id(favorite_index) < 0) {
            // Playing something that is not a favorite. Step in from the end
            // the user asked for rather than guessing at a position.
            id(pending_index) = delta >= 0 ? 0 : total - 1;
          } else {
            id(pending_index) = (id(favorite_index) + delta % total + total) % total;
          }
      - lambda: |-
          ESP_LOGI("music_bar", "-> asking to play favorite %d of %d",
                   id(pending_index), id(favorite_total));
      - homeassistant.event:
          event: esphome.music_bar_play_index
          data:
            device: !lambda "return App.get_name();"
            index: !lambda "return id(pending_index);"


  # Repaint the five browser tiles from the globals the `page` action filled.
  #
  # Artwork is not used yet: every tile draws a monogram, which needs no image
  # slot, no buffer and no fetch. That is deliberate — see docs/spec.md
  # section 4 for why the browser is proven on monograms before an image slot
  # is ever handed a URL.
  - id: paint_tiles
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(favorite_total) <= 0;"
          then:
            - lvgl.widget.show: lbl_browser_empty
          else:
            - lvgl.widget.hide: lbl_browser_empty
      - if:
          condition:
            lambda: "return 0 < (int) id(tile_names).size();"
          then:
            - lvgl.widget.show: tile_0
            - lvgl.label.update:
                id: tile_0_name
                text: !lambda "return music_bar::nth(id(tile_names), 0);"
            - lvgl.label.update:
                id: tile_0_initials
                text: !lambda |-
                  return music_bar::initials(music_bar::nth(id(tile_names), 0));
            - lvgl.widget.update:
                id: tile_0_mat
                bg_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_bg_hex(music_bar::nth(id(tile_names), 0)));
            - lvgl.label.update:
                id: tile_0_initials
                text_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_fg_hex(music_bar::nth(id(tile_names), 0)));
          else:
            - lvgl.widget.hide: tile_0
      - if:
          condition:
            lambda: "return 1 < (int) id(tile_names).size();"
          then:
            - lvgl.widget.show: tile_1
            - lvgl.label.update:
                id: tile_1_name
                text: !lambda "return music_bar::nth(id(tile_names), 1);"
            - lvgl.label.update:
                id: tile_1_initials
                text: !lambda |-
                  return music_bar::initials(music_bar::nth(id(tile_names), 1));
            - lvgl.widget.update:
                id: tile_1_mat
                bg_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_bg_hex(music_bar::nth(id(tile_names), 1)));
            - lvgl.label.update:
                id: tile_1_initials
                text_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_fg_hex(music_bar::nth(id(tile_names), 1)));
          else:
            - lvgl.widget.hide: tile_1
      - if:
          condition:
            lambda: "return 2 < (int) id(tile_names).size();"
          then:
            - lvgl.widget.show: tile_2
            - lvgl.label.update:
                id: tile_2_name
                text: !lambda "return music_bar::nth(id(tile_names), 2);"
            - lvgl.label.update:
                id: tile_2_initials
                text: !lambda |-
                  return music_bar::initials(music_bar::nth(id(tile_names), 2));
            - lvgl.widget.update:
                id: tile_2_mat
                bg_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_bg_hex(music_bar::nth(id(tile_names), 2)));
            - lvgl.label.update:
                id: tile_2_initials
                text_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_fg_hex(music_bar::nth(id(tile_names), 2)));
          else:
            - lvgl.widget.hide: tile_2
      - if:
          condition:
            lambda: "return 3 < (int) id(tile_names).size();"
          then:
            - lvgl.widget.show: tile_3
            - lvgl.label.update:
                id: tile_3_name
                text: !lambda "return music_bar::nth(id(tile_names), 3);"
            - lvgl.label.update:
                id: tile_3_initials
                text: !lambda |-
                  return music_bar::initials(music_bar::nth(id(tile_names), 3));
            - lvgl.widget.update:
                id: tile_3_mat
                bg_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_bg_hex(music_bar::nth(id(tile_names), 3)));
            - lvgl.label.update:
                id: tile_3_initials
                text_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_fg_hex(music_bar::nth(id(tile_names), 3)));
          else:
            - lvgl.widget.hide: tile_3
      - if:
          condition:
            lambda: "return 4 < (int) id(tile_names).size();"
          then:
            - lvgl.widget.show: tile_4
            - lvgl.label.update:
                id: tile_4_name
                text: !lambda "return music_bar::nth(id(tile_names), 4);"
            - lvgl.label.update:
                id: tile_4_initials
                text: !lambda |-
                  return music_bar::initials(music_bar::nth(id(tile_names), 4));
            - lvgl.widget.update:
                id: tile_4_mat
                bg_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_bg_hex(music_bar::nth(id(tile_names), 4)));
            - lvgl.label.update:
                id: tile_4_initials
                text_color: !lambda |-
                  return lv_color_hex(music_bar::monogram_fg_hex(music_bar::nth(id(tile_names), 4)));
          else:
            - lvgl.widget.hide: tile_4

  # Rewrite the Now Playing text and point the artwork slot at its URL.
  - id: paint_now_playing
    mode: restart
    then:
      # Every line is rewritten on every push, including to empty. Updating
      # only the fields that arrived leaves the previous track's artist sitting
      # under the new title, which reads as a bug in the panel rather than as
      # missing metadata.
      - lvgl.label.update:
          id: lbl_album
          text: !lambda |-
            if (!id(np_album).empty()) return id(np_album);
            if (!id(np_artist).empty()) return id(np_artist);
            if (!id(np_title).empty()) return id(np_title);
            // Nothing at all: say so, rather than leaving the last track up.
            return std::string("Nothing playing");
      - lvgl.label.update:
          id: lbl_artist
          text: !lambda |-
            // The artist line is blank when it is the album line already.
            return id(np_album).empty() ? std::string("") : id(np_artist);
      - lvgl.label.update:
          id: lbl_title
          text: !lambda "return id(np_title);"
      - lvgl.label.update:
          id: lbl_playpause
          text: !lambda |-
            return id(np_state) == "playing" ? std::string("\U000F03E4")
                                             : std::string("\U000F040A");
      # Only refetch when the artwork actually changed. Compared against what
      # is on screen rather than what was last requested, because online_image
      # silently drops an update while a download is in flight — so a
      # requested-URL variable can advance without anything having changed.
      - if:
          condition:
            lambda: |-
              return !id(np_art_url).empty() && id(np_art_url) != id(shown_art_url);
          then:
            - lambda: 'id(shown_art_url) = id(np_art_url);'
            - online_image.set_url:
                id: art_png
                url: !lambda "return id(np_art_url_full);"
      - if:
          condition:
            lambda: "return id(np_art_url).empty();"
          then:
            - lambda: 'id(shown_art_url) = "";'
            - lvgl.widget.update:
                id: art_frame
                bg_color: 0x111111
            - lvgl.widget.hide: img_art
            - lvgl.widget.show: lbl_art_ph

  - id: transport_play_pause
    mode: restart
    then:
      - homeassistant.event:
          event: esphome.music_bar_transport
          data:
            device: !lambda "return App.get_name();"
            action: "play_pause"

  # One place that decides what the panel is currently telling the user.
  - id: announce_setup_state
    mode: restart
    then:
      - lambda: |-
          std::string state;
          if (!id(wifi_component).is_connected()) {
            state = "Waiting for Wi-Fi";
          } else if (id(ha_handshake_ok)) {
            state = "Ready";
          } else if (!id(ha_handshake_attempted)) {
            state = "Connecting to Home Assistant";
          } else {
            // Nobody answered. Either the blueprint is not imported, or the
            // per-device action toggle is off — and the second is by far the
            // more common, so name it.
            state = "Home Assistant did not answer. Settings > Devices & "
                    "Services > ESPHome > this device > gear > enable 'Allow "
                    "the device to perform Home Assistant actions', then "
                    "import the music-bar blueprints.";
          }
          id(setup_state).publish_state(state);
      - lvgl.label.update:
          id: lbl_setup_state
          text: !lambda "return id(setup_state).state;"
      # Leave the setup screen the moment Home Assistant answers, and go back
      # to it if the answer stops arriving — the screen is the only place a
      # user without Home Assistant open can see what is wrong.
      # Leave the setup screen once Home Assistant answers, and return to it if
      # the answer stops arriving. Guarded by a flag we maintain rather than by
      # asking LVGL which page is showing: this script also runs on API
      # reconnects, and an unconditional page.show would drag someone off the
      # browser mid-scroll.
      - if:
          condition:
            lambda: "return id(ha_handshake_ok) && id(on_setup_page);"
          then:
            - lvgl.page.show: page_now_playing
            - lambda: "id(on_setup_page) = false;"
      - if:
          condition:
            lambda: "return !id(ha_handshake_ok) && !id(on_setup_page);"
          then:
            - lvgl.page.show: page_setup
            - lambda: "id(on_setup_page) = true;"

# -- Diagnostics ------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "Status"
    id: status_sensor
    entity_category: diagnostic

sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    id: chip_temperature
    entity_category: diagnostic
    disabled_by_default: true

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true

text_sensor:
  # What the panel is currently telling the user, mirrored into Home Assistant
  # so the same diagnosis is available without walking over to look at it.
  - platform: template
    name: "Setup Status"
    id: setup_state
    entity_category: diagnostic
    update_interval: never

  # Both of these are compile-time constants, so they are published once from
  # on_boot rather than polled.
  #
  # They deliberately carry no `lambda:`. A template sensor with
  # `update_interval: never` never runs its lambda — that is what `never`
  # means — so a lambda here would leave the entity permanently empty, which is
  # exactly what happened the first time this was flashed. Anything comparing
  # against it would have been comparing against an empty string and finding no
  # disagreement.

  # The size this firmware's image slots are built for. The artwork side
  # compares this against the manifest and refuses to push mismatched images.
  - platform: template
    name: "Tile Size"
    id: tile_size
    entity_category: diagnostic
    update_interval: never

  # Which panel this firmware was built for. Worth reporting because the
  # project supports one device today and expects to support more.
  - platform: template
    name: "Device Profile"
    id: device_profile_sensor
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_address
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      id: wifi_ssid
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "MAC Address"
      id: wifi_mac_address
      entity_category: diagnostic
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    entity_category: diagnostic
    disabled_by_default: true

# -- Recovery ---------------------------------------------------------------
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    id: safe_mode_button
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    entity_category: config

  # Re-runs the boot handshake without a reboot, for when someone has just
  # flipped the actions toggle and wants to know whether it worked.
  - platform: template
    name: "Retry Home Assistant Handshake"
    id: retry_handshake_button
    entity_category: config
    on_press:
      - script.execute: ha_handshake

  # -- Controls -------------------------------------------------------------
  # These are the real controls, exposed as entities. The LVGL buttons will
  # call the same scripts, so the transport works identically whether it is
  # driven from the panel's own screen, from a Home Assistant dashboard, or
  # from an automation.
  #
  # They also make the panel fully testable before the display exists: flash
  # this, adopt it, and the entire Home Assistant contract can be exercised
  # from the device page while the screen is still blank.

  - platform: template
    name: "Previous Favorite"
    id: prev_favorite_button
    icon: mdi:skip-previous
    on_press:
      - script.execute:
          id: favorite_step
          delta: -1

  - platform: template
    name: "Next Favorite"
    id: next_favorite_button
    icon: mdi:skip-next
    on_press:
      - script.execute:
          id: favorite_step
          delta: 1

  - platform: template
    name: "Play Pause"
    id: play_pause_button
    icon: mdi:play-pause
    on_press:
      - script.execute: transport_play_pause

  - platform: template
    name: "Next Page"
    id: next_page_button
    icon: mdi:chevron-right
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: request_page
          page: !lambda "return id(page_index) + 1;"

  - platform: template
    name: "Previous Page"
    id: prev_page_button
    icon: mdi:chevron-left
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: request_page
          page: !lambda "return id(page_index) - 1;"

  # Stands in for tapping a tile until there are tiles to tap. Set Tile Number,
  # then press this.
  - platform: template
    name: "Play Selected Tile"
    id: play_tile_button
    icon: mdi:play-box
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: play_tile
          index: !lambda "return (int) id(tile_number).state - 1;"

number:
  - platform: template
    name: "Tile Number"
    id: tile_number
    icon: mdi:numeric
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_value: 1
    min_value: 1
    max_value: 5
    step: 1

# -- Optional ---------------------------------------------------------------
# Local web UI at http://<device>.local. Off by default: Home Assistant is the
# interface, and this costs RAM that the framebuffer wants. Unauthenticated on
# a trusted LAN unless you add `auth:`.
#
# web_server:
#   id: web_server_main
#   port: 80

# -- Display ----------------------------------------------------------------
# TODO: AXS15231B QSPI display + touch, LVGL layout, five browser tiles and six
# image slots. Ported from the hifi-panel build, which is on the ESPHome host —
# retrieve it before starting rather than reconstructing the QSPI init sequence
# from scratch. Until then this config builds, provisions, adopts and reports
# its own setup state, which is what the blueprints and the artwork side are
# developed against.

# -- Fonts ------------------------------------------------------------------
# A broad-ish Latin set: track and artist metadata is unpredictable and covers
# English, French, German and Spanish routinely. Rarer scripts render as tofu
# boxes, which is also why the monogram helper returns "" for a name with no
# ASCII letters and the tile falls back to a media-type glyph.
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 28
    glyphs: &ui_glyphs "0123456789 .,:;!?'\"-/&()%<>ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝàáâãäåæçèéêëìíîïñòóôõöøùúûüýÿ"
  - file: "gfonts://Roboto"
    id: font_body
    size: 21
    glyphs: *ui_glyphs
  - file: "gfonts://Roboto"
    id: font_sm
    size: 15
    glyphs: *ui_glyphs
  - file: "gfonts://Roboto"
    id: font_mono_lg
    size: 34
    glyphs: *ui_glyphs

  # Material Design Icons. Codepoints verified against meta.json in
  # Templarian/MaterialDesign-SVG — do not guess them, several sit one digit
  # from an unrelated icon (dots-horizontal is F01D8, not F01D9).
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon
    size: 30
    glyphs:
      - "\U000F040A"  # play
      - "\U000F03E4"  # pause
      - "\U000F04AE"  # skip-previous
      - "\U000F04AD"  # skip-next
      - "\U000F01D8"  # dots-horizontal
      - "\U000F0141"  # chevron-left
      - "\U000F004D"  # arrow-left (browser Back)
      - "\U000F0142"  # chevron-right
      - "\U000F0439"  # radio
      - "\U000F0B47"  # playlist-music
      - "\U000F00E2"  # album
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_xl
    size: 64
    glyphs:
      - "\U000F075A"  # music, the now-playing art placeholder

# Needed by online_image. Most artwork comes from Music Assistant over plain
# HTTP on the LAN, but a Spotify Connect stream has no proxy path and its
# artwork is fetched straight from Spotify's CDN over HTTPS, so TLS has to be
# available. verify_ssl would pull in a CA bundle and the memory to validate
# against it; these are public, read-only album covers on a device that only
# ever fetches a URL Home Assistant handed it, so skipping validation is the
# cheaper trade.
http_request:
  id: http_request_main
  useragent: esphome/music-bar
  timeout: 8s
  verify_ssl: false

# -- Now Playing artwork ----------------------------------------------------
# One runtime image, fed a pre-bounded URL by the blueprint. The browser tiles
# deliberately use no image slots yet — they draw monograms — so this is the
# only decode the panel ever does. See docs/spec.md section 4.
#
# The URL below is a compile-time placeholder; the real one arrives at runtime.
image:
  - platform: online_image
    id: art_png
    url: "http://127.0.0.1/placeholder.png"
    format: PNG
    type: RGB565
    resize: 152x152
    update_interval: never
    buffer_size: 16384
    # byte_order is deliberately left at its default. lv_conf.h sets
    # LV_COLOR_16_SWAP 1, which looks like it demands big-endian images and
    # does not: LVGL uses that macro in exactly one place, swapping on the way
    # *out* to the panel long after image data is read. Setting BIG_ENDIAN here
    # renders teal as orange. Pure black-and-white images are invariant under
    # the swap, so never check this with a monochrome logo.
    #
    # ALPHA_CHANNEL because many station logos are transparent PNGs, and the
    # default opaque path paints whatever undefined RGB sits under transparent
    # pixels. Music Assistant cannot flatten them for us — its proxy handler
    # never passes the flatten argument.
    transparency: ALPHA_CHANNEL
    on_download_finished:
      - lambda: 'ESP_LOGI("music_bar", "art: decoded (cached=%d)", (int) cached);'
      # Re-bind, or the widget stays permanently blank. lv_image_set_src()
      # caches the result of lv_image_decoder_get_info(), and at setup time the
      # buffer is still null so that call fails and LVGL clears the source.
      # Nothing in online_image invalidates LVGL's cache, so the only way to
      # pick up the decoded buffer is to set the source again here.
      - lvgl.image.update:
          id: img_art
          src: art_png
      - lvgl.widget.update:
          id: art_frame
          bg_color: 0x808080
      - lvgl.widget.hide: lbl_art_ph
      - lvgl.widget.show: img_art
    on_error:
      - lambda: 'ESP_LOGW("music_bar", "art: download or decode failed");'
      - lvgl.widget.update:
          id: art_frame
          bg_color: 0x111111
      - lvgl.widget.hide: img_art
      - lvgl.widget.show: lbl_art_ph

# -- The screen -------------------------------------------------------------
# Geometry assumes 640x172. A device profile with a different screen needs its
# own layout; the coordinates below are measured against this one.
lvgl:
  displays:
    - lcd
  # Global rotation, with display and touchscreen left native. Current ESPHome
  # rotates LVGL hit-testing internally to match; the raw touchscreen on_touch
  # trigger still reports un-rotated coordinates, which is expected.
  rotation: 90°
  # The AXS15231 only does partial draws on 8-pixel boundaries and 172 is not
  # divisible by 8, so partial redraws leave stale pixels behind.
  full_refresh: true
  # One accent for every button on every page, rather than repeating styles on
  # each of them. Per-widget overrides still work.
  theme:
    button:
      bg_color: 0x0095FF
      bg_opa: COVER
      border_width: 0
      radius: 8
      text_color: 0xFFFFFF
      pad_all: 0
      pressed:
        bg_color: 0x006FBF

  pages:
    # ═══════════════════════ Setup ═══════════════════════
    # Shown until Home Assistant answers the handshake. The panel has a screen,
    # so it says what is wrong with its own install instead of looking broken.
    - id: page_setup
      bg_color: 0x000000
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - label:
            id: lbl_setup_title
            x: 20
            y: 18
            width: 600
            text: "Music Bar"
            text_font: font_title
            text_color: 0xFFFFFF
        - label:
            id: lbl_setup_state
            x: 20
            y: 60
            width: 600
            height: 100
            text: "Starting…"
            text_font: font_sm
            text_color: 0xB0B0B0
            long_mode: WRAP

    # ═══════════════════════ Now Playing ═══════════════════════
    - id: page_now_playing
      bg_color: 0x000000
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: art_frame
            x: 8
            y: 10
            width: 152
            height: 152
            bg_color: 0x111111
            bg_opa: COVER
            radius: 6
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: lbl_art_ph
                  align: CENTER
                  text: "\U000F075A"
                  text_font: font_icon_xl
                  text_color: 0x333333
              - image:
                  id: img_art
                  align: CENTER
                  src: art_png
                  hidden: true

        - label:
            id: lbl_album
            x: 172
            y: 10
            width: 410
            height: 34
            text_font: font_title
            text_color: 0xFFFFFF
            long_mode: SCROLL_CIRCULAR
            text: "Music Bar"
        - label:
            id: lbl_artist
            x: 172
            y: 47
            width: 410
            height: 26
            text_font: font_body
            text_color: 0xFFFFFF
            long_mode: SCROLL_CIRCULAR
            text: ""
        - label:
            id: lbl_title
            x: 172
            y: 76
            width: 410
            height: 26
            text_font: font_body
            text_color: 0xB0B0B0
            long_mode: SCROLL_CIRCULAR
            text: ""

        # Prev and next move between favorites, not tracks. That is the whole
        # point of the bar — see docs/spec.md section 2.
        - button:
            id: btn_prev
            x: 172
            y: 108
            width: 88
            height: 58
            on_press:
              - script.execute:
                  id: favorite_step
                  delta: -1
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F04AE"
                  text_font: font_icon
        - button:
            id: btn_playpause
            x: 268
            y: 108
            width: 88
            height: 58
            on_press:
              - script.execute: transport_play_pause
            widgets:
              - label:
                  id: lbl_playpause
                  align: CENTER
                  text: "\U000F040A"
                  text_font: font_icon
        - button:
            id: btn_next
            x: 364
            y: 108
            width: 88
            height: 58
            on_press:
              - script.execute:
                  id: favorite_step
                  delta: 1
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F04AD"
                  text_font: font_icon

        - button:
            id: btn_to_browser
            x: 590
            y: 0
            width: 50
            height: 172
            radius: 0
            on_press:
              - lvgl.page.show: page_browser
              - script.execute:
                  id: request_page
                  page: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F01D8"
                  text_font: font_icon

    # ═══════════════════════ Browser ═══════════════════════
    # Exactly one browser page holding five tiles. LVGL widgets are created at
    # compile time and cannot be added at runtime, so paging means rewriting
    # these five rather than navigating between pre-built pages — which is what
    # keeps the browser independent of how many favorites you have.
    - id: page_browser
      bg_color: 0x000000
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        # Left is Back, always. Right is Forward, always, and cycles.
        #
        # Paging both ways sounds more capable and is worse to use: with a long
        # list you spend the whole time deciding which chevron gets you there
        # sooner, and neither one leaves. One direction plus a way out is fewer
        # decisions per tap, and forward-cycling means the far end of the list
        # is reachable without ever reversing.
        - button:
            id: btn_browser_back
            x: 0
            y: 0
            width: 46
            height: 172
            radius: 0
            on_press:
              - lvgl.page.show: page_now_playing
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F004D"
                  text_font: font_icon
        # Forward only, wrapping past the last page back to the first — the
        # wrap is in request_page, which knows how many pages there are.
        - button:
            id: btn_page_next
            x: 594
            y: 0
            width: 46
            height: 172
            radius: 0
            on_press:
              - script.execute:
                  id: request_page
                  page: !lambda "return id(page_index) + 1;"
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0142"
                  text_font: font_icon
        # Shown instead of the grid when there is nothing to browse. Favorites
        # are the whole content model, so a user with none gets an empty panel
        # and deserves to be told why rather than left looking at five blank
        # rectangles. See docs/spec.md section 5.
        - label:
            id: lbl_browser_empty
            x: 60
            y: 50
            width: 520
            height: 80
            hidden: true
            text: "Nothing favorited yet.\n\nMark a station or playlist as a favorite in Music Assistant and it appears here."
            text_font: font_sm
            text_color: 0xB0B0B0
            long_mode: WRAP
            text_align: CENTER

        - button:
            id: tile_0
            x: 50
            y: 4
            width: 104
            height: 164
            bg_color: 0x1E1E1E
            radius: 8
            on_press:
              - script.execute:
                  id: play_tile
                  index: 0
            widgets:
              # The monogram mat. A plain `obj` nested in a button swallows
              # presses — LVGL sets LV_OBJ_FLAG_CLICKABLE on obj by default,
              # while label and image both clear it — so this must be
              # explicitly unclickable or it eats every tap on the artwork.
              - obj:
                  id: tile_0_mat
                  align: TOP_MID
                  y: 6
                  width: 88
                  height: 88
                  bg_color: 0x333333
                  bg_opa: COVER
                  radius: 6
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: tile_0_initials
                        align: CENTER
                        text: ""
                        text_font: font_mono_lg
                        text_color: 0xFFFFFF
              - label:
                  id: tile_0_name
                  align: TOP_MID
                  y: 98
                  width: 98
                  text: ""
                  text_font: font_sm
                  text_color: 0xFFFFFF
                  long_mode: WRAP
                  text_align: CENTER
        - button:
            id: tile_1
            x: 159
            y: 4
            width: 104
            height: 164
            bg_color: 0x1E1E1E
            radius: 8
            on_press:
              - script.execute:
                  id: play_tile
                  index: 1
            widgets:
              # The monogram mat. A plain `obj` nested in a button swallows
              # presses — LVGL sets LV_OBJ_FLAG_CLICKABLE on obj by default,
              # while label and image both clear it — so this must be
              # explicitly unclickable or it eats every tap on the artwork.
              - obj:
                  id: tile_1_mat
                  align: TOP_MID
                  y: 6
                  width: 88
                  height: 88
                  bg_color: 0x333333
                  bg_opa: COVER
                  radius: 6
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: tile_1_initials
                        align: CENTER
                        text: ""
                        text_font: font_mono_lg
                        text_color: 0xFFFFFF
              - label:
                  id: tile_1_name
                  align: TOP_MID
                  y: 98
                  width: 98
                  text: ""
                  text_font: font_sm
                  text_color: 0xFFFFFF
                  long_mode: WRAP
                  text_align: CENTER
        - button:
            id: tile_2
            x: 268
            y: 4
            width: 104
            height: 164
            bg_color: 0x1E1E1E
            radius: 8
            on_press:
              - script.execute:
                  id: play_tile
                  index: 2
            widgets:
              # The monogram mat. A plain `obj` nested in a button swallows
              # presses — LVGL sets LV_OBJ_FLAG_CLICKABLE on obj by default,
              # while label and image both clear it — so this must be
              # explicitly unclickable or it eats every tap on the artwork.
              - obj:
                  id: tile_2_mat
                  align: TOP_MID
                  y: 6
                  width: 88
                  height: 88
                  bg_color: 0x333333
                  bg_opa: COVER
                  radius: 6
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: tile_2_initials
                        align: CENTER
