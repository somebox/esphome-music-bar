# ESPHome secrets — DEV / CI BUILDS ONLY.
#
# The factory and example builds do NOT use this file. They provision Wi-Fi
# over Improv and let Home Assistant negotiate a per-device Noise key at
# adoption, so nothing is baked into the binary.
#
# This exists for the one case that path does not cover: a panel that must come
# up fully configured with no Home Assistant round-trip — an offline rig, CI, or
# a bench unit you reflash constantly and do not want to re-adopt each time.
#
# Copy to esphome/secrets.yaml (gitignored) and fill in.
# Generate fresh values:
#   openssl rand -base64 32     # api key
#   openssl rand -hex 16        # ota password

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"
fallback_ap_password: "change-me-12-chars-min"
music_bar_api_key: "GENERATE_WITH_openssl_rand_-base64_32"
music_bar_ota_password: "GENERATE_WITH_openssl_rand_-hex_16"

# To use these, add the following to a per-device YAML (never commit it):
#
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#     ap:
#       password: !secret fallback_ap_password
#   api:
#     encryption:
#       key: !secret music_bar_api_key
#   ota:
#     - platform: esphome
#       password: !secret music_bar_ota_password
#
# Pinning a key means Home Assistant will not negotiate one. If HA already
# adopted this panel with a runtime key, delete the device in HA first or the
# keys will not match.
